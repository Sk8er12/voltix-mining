
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080D18">
<title>VOLTIX Mining</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080D18;color:white;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:24px;
}
.app{width:100%;max-width:420px;text-align:center}
.logo{
 width:112px;height:112px;margin:0 auto 25px;
 border-radius:32px;
 background:linear-gradient(145deg,#153B75,#071326);
 border:1px solid #2767B8;
 display:grid;place-items:center;
 box-shadow:0 0 55px #0879ff35;
 font-size:54px;font-weight:900;color:#62B7FF;
}
h1{font-size:36px;letter-spacing:5px;margin:0}
.sub{color:#8194B2;letter-spacing:4px;font-size:13px;margin-top:14px}
.tag{
 display:inline-block;margin-top:32px;padding:9px 16px;
 border:1px solid #24446c;border-radius:30px;
 color:#65B7FF;font-size:12px;letter-spacing:2px
}
h2{font-size:25px;margin:30px 0 12px}
.desc{color:#8999B1;font-size:15px;line-height:1.7}
.connect{
 width:100%;margin-top:35px;padding:20px;
 border:0;border-radius:16px;
 background:linear-gradient(100deg,#1679E9,#38B7FF);
 color:white;font-size:18px;font-weight:700;
 box-shadow:0 8px 35px #168bff35;
 cursor:pointer;
}
.status{
 margin-top:22px;padding:17px;
 border:1px solid #24446c;border-radius:14px;
 background:#101b2c;display:none;
 overflow-wrap:anywhere;
}
.address{color:#65B7FF;font-size:13px;margin-top:12px}
.disconnect{
 margin-top:15px;background:transparent;
 color:#8999B1;border:1px solid #34445c;
 padding:10px 20px;border-radius:10px;
}
.note{font-size:11px;color:#687B96;margin-top:18px}
.footer{margin-top:65px;color:#52647E;font-size:11px;letter-spacing:3px}
</style>
</head>

<body>
<main class="app">
 <div class="logo">V</div>
 <h1>VOLTIX</h1>
 <div class="sub">MINING ECOSYSTEM</div>
 <div class="tag">● NEXT GENERATION MINING</div>
 <h2>Mine. Earn. Grow.</h2>
 <p class="desc">
 Welcome to VOLTIX.<br>
 Connect your TON wallet to enter the ecosystem.
 </p>

 <button class="connect" id="connect">
 Connect TON Wallet
 </button>

 <div class="status" id="status">
  <div>WALLET CONNECTED</div>
  <div class="address" id="address"></div>
  <button class="disconnect" id="disconnect">
   Disconnect Wallet
  </button>
 </div>

 <p class="note">SECURE CONNECTION · TON CONNECT</p>
 <div class="footer">POWERED BY TON BLOCKCHAIN</div>
</main>

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<script>
const connectButton = document.getElementById("connect");
const statusBox = document.getElementById("status");
const addressBox = document.getElementById("address");

let tonUI;

try {
 tonUI = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl:
   "https://voltix-mining.pages.dev/tonconnect-manifest.json"
 });

 tonUI.uiOptions = {
  language: "en",
  uiPreferences: { theme: "DARK" }
 };

 let proofCheckInProgress = false;
 tonUI.onStatusChange(async wallet => {
  if(wallet && wallet.account) {
   const item = wallet.connectItems && wallet.connectItems.tonProof;
   if (!item || !item.proof) {
    if (!proofCheckInProgress) {
     proofCheckInProgress = true;
     try { await tonUI.disconnect(); } catch (e) {}
     connectButton.textContent = "Wallet must support TON Proof";
     connectButton.style.display = "block";
     statusBox.style.display = "none";
     proofCheckInProgress = false;
    }
    return;
   }
   if (proofCheckInProgress) return;
   proofCheckInProgress = true;
   connectButton.style.display = "block";
   connectButton.textContent = "Verifying wallet ownership...";
   try {
    const response = await fetch("/api/ton-proof/verify", {
     method: "POST",
     credentials: "same-origin",
     headers: { "Content-Type": "application/json" },
     body: JSON.stringify({
      address: wallet.account.address,
      network: wallet.account.chain,
      public_key: wallet.account.publicKey,
      proof: {
       ...item.proof,
       state_init: wallet.account.walletStateInit
      }
     })
    });
    if (!response.ok) throw new Error("TON Proof was rejected");
    const result = await response.json();
    connectButton.style.display = "none";
    statusBox.style.display = "block";
    addressBox.textContent = result.address.slice(0,8) + "..." + result.address.slice(-8);
   } catch (error) {
    console.error(error);
    connectButton.textContent = "Verification failed — reconnect";
    try { await tonUI.disconnect(); } catch (e) {}
   } finally {
    proofCheckInProgress = false;
   }
  } else {
   connectButton.style.display = "block";
   connectButton.textContent = "Connect TON Wallet";
   statusBox.style.display = "none";
  }
 });

 connectButton.addEventListener("click", async () => {
  connectButton.disabled = true;
  connectButton.textContent = "Preparing secure login...";
  try {
   const response = await fetch("/api/ton-proof/payload", {
    method: "POST",
    credentials: "same-origin"
   });
   if (!response.ok) throw new Error("Could not create login challenge");
   const data = await response.json();
   tonUI.setConnectRequestParameters({
    state: "ready",
    value: { tonProof: data.payload }
   });
   await tonUI.openModal();
  } catch (error) {
   console.error(error);
   connectButton.textContent = "Try connecting again";
  } finally {
   connectButton.disabled = false;
  }
 });

 document.getElementById("disconnect")
  .addEventListener("click", async () => {
   await tonUI.disconnect();
  });

} catch(error) {
 console.error("TON Connect error:", error);
 connectButton.textContent = "Connection unavailable";
}
</script>
</body>
</html>
