name: Build check
on:
  push:
    branches: [feat/ton-proof-auth]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: mkdir -p dist && cp index.html tonconnect-manifest.json dist/ && cp icon.PNG dist/icon.png && npx esbuild@0.25.0 _worker.js --bundle --format=esm --platform=browser --target=es2022 --outfile=dist/_worker.js
